apiVersion: 1

# Read-only role created by `python -m loader.main`. Credentials come from the container
# environment (itself fed by .env): nothing secret is stored in this file.
datasources:
  - name: MobilityPulse
    uid: mobilitypulse-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: $GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
