[project]
name = "mobilitypulse-france"
version = "0.1.0"
description = "Real-time bike-sharing data platform (GBFS -> Kafka -> Spark -> Parquet)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests==2.32.5",
    "confluent-kafka==2.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
]
spark = [
    "pyspark==3.5.7",
    "numpy==1.26.4",  # required by pyspark.ml
]
loader = [
    "psycopg[binary]==3.2.3",
    "pyarrow==17.0.0",
]
web = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
